<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>SAPD Galeri</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">SAPD</div>
    <ul class="nav-links">
        <li><a href="index.html">Ana Sayfa</a></li>
        <li><a href="kurallar.html">Kurallar</a></li>
        <li><a href="depo.html">Depo</a></li>
        <li><a href="illegal.html">İllegal</a></li>
        <li><a href="galeri.html" class="active">Galeri</a></li>
    </ul>
</nav>

<section class="gallery-header">
    <h1>Departman Galerisi</h1>
    <p>Departman içi faaliyet ve görüntüler</p>
</section>

<section class="photo-grid">
    <!-- Küçük resim galerisi -->
    <img src="img/galeri1.jpg" onclick="openModal(0)">
    <img src="img/galeri2.jpg" onclick="openModal(1)">
    <img src="img/galeri3.jpg" onclick="openModal(2)">
    <img src="img/galeri4.jpg" onclick="openModal(3)">
    <img src="img/galeri5.jpg" onclick="openModal(0)">
    <img src="img/galeri6.jpg" onclick="openModal(0)">
    <img src="img/galeri7.jpg" onclick="openModal(0)">
    <img src="img/galeri8.jpg" onclick="openModal(0)">
    <img src="img/galeri9.jpg" onclick="openModal(0)">
    <img src="img/galeri10.jpg" onclick="openModal(0)">
    <img src="img/galeri11.jpg" onclick="openModal(0)">
    <img src="img/galeri12.jpg" onclick="openModal(0)">
    <img src="img/galeri13.jpg" onclick="openModal(0)">
    <img src="img/galeri14.jpg" onclick="openModal(0)">
    <img src="img/galeri15.jpg" onclick="openModal(0)">
</section>

<!-- MODAL / LIGHTBOX -->
<div id="photoModal" class="modal">
    <button class="exit-btn" onclick="closeModal()">← Galeriye Dön</button>

    <span class="close" onclick="closeModal()">&times;</span>

    <img class="modal-content" id="modalImg">
    <p id="modalDesc" class="modal-desc"></p>

    <div class="modal-nav">
        <button onclick="changePhoto(-1)">&#10094;</button>
        <button onclick="changePhoto(1)">&#10095;</button>
    </div>
</div>


<script>
const photos = [
    "img/galeri1.jpg",
    "img/galeri2.jpg",
    "img/galeri3.jpg",
    "img/galeri4.jpg"
];
let currentPhoto = 0;

function openModal(index) {
    currentPhoto = index;
    document.getElementById("modalImg").src = photos[index];
    document.getElementById("photoModal").style.display = "block";
}

function closeModal() {
    document.getElementById("photoModal").style.display = "none";
}

function changePhoto(direction) {
    currentPhoto = (currentPhoto + direction + photos.length) % photos.length;
    document.getElementById("modalImg").src = photos[currentPhoto];
}
</script>

</body>
</html>
