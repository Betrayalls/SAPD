<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>SAPD Galeri</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">SAPD</div>
    <ul class="nav-links">
        <li><a href="index.html">Ana Sayfa</a></li>
        <li><a href="kurallar.html">Kurallar</a></li>
        <li><a href="depo.html">Depo</a></li>
        <li><a href="illegal.html">İllegal</a></li>
        <li><a href="galeri.html" class="active">Galeri</a></li>
    </ul>
</nav>

<section class="gallery-header">
    <h1>Departman Galerisi</h1>
    <p>Departman içi faaliyet ve görüntüler</p>
</section>

<section class="photo-grid">
    <div class="photo-item" onclick="openModal(0)">
        <img src="img/galeri1.jpg">
        <p>Operasyon öncesi brifing</p>
    </div>

    <div class="photo-item" onclick="openModal(1)">
        <img src="img/galeri2.jpg">
        <p>Departman içi eğitim</p>
    </div>

    <div class="photo-item" onclick="openModal(2)">
        <img src="img/galeri3.jpg">
        <p>Gece devriyesi</p>
    </div>

    <div class="photo-item" onclick="openModal(3)">
        <img src="img/galeri4.jpg">
        <p>Operasyon sonrası değerlendirme</p>
    </div>
</section>


<!-- MODAL / LIGHTBOX -->
<div id="photoModal" class="modal">
    <button class="exit-btn" onclick="closeModal()">← Galeriye Dön</button>

    <span class="close" onclick="closeModal()">&times;</span>

    <img class="modal-content" id="modalImg">
    <p id="modalDesc" class="modal-desc"></p>

    <div class="modal-nav">
        <button onclick="changePhoto(-1)">&#10094;</button>
        <button onclick="changePhoto(1)">&#10095;</button>
    </div>
</div>



<script>
const photos = [
    { src: "img/galeri1.jpg", desc: "Operasyon öncesi brifing" },
    { src: "img/galeri2.jpg", desc: "Departman içi eğitim" },
    { src: "img/galeri3.jpg", desc: "Gece devriyesi" },
    { src: "img/galeri4.jpg", desc: "Operasyon sonrası değerlendirme" }
];

let currentPhoto = 0;

function openModal(index) {
    currentPhoto = index;
    document.getElementById("modalImg").src = photos[index].src;
    document.getElementById("modalDesc").innerText = photos[index].desc;
    document.getElementById("photoModal").style.display = "block";
}

function closeModal() {
    document.getElementById("photoModal").style.display = "none";
}

function changePhoto(direction) {
    currentPhoto = (currentPhoto + direction + photos.length) % photos.length;
    document.getElementById("modalImg").src = photos[currentPhoto].src;
    document.getElementById("modalDesc").innerText = photos[currentPhoto].desc;
}
</script>


</body>
</html>
