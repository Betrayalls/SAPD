<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Departman Galerisi | SAPD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">SAPD</div>
    <ul>
        <li><a href="index.html">Anasayfa</a></li>
        <li><a href="galeri.html" class="active">Galeri</a></li>
    </ul>
</nav>

<section class="section">
    <h2>📸 Departman Galerisi</h2>
    <p style="opacity:.7; margin-bottom:40px;">
        Eğitimler, Operasyonlar ve Departman İçi Görüntüler
    </p>

    <div class="gallery-grid">

        <div class="gallery-item" onclick="openModal('img/galeri1.jpg')">
            <img src="img/galeri1.jpg">
            <span class="gallery-text">SWAT Operasyon Eğitimi</span>
        </div>

        <div class="gallery-item" onclick="openModal('img/galeri2.jpg')">
            <img src="img/galeri2.jpg">
            <span class="gallery-text">HSU Gece Takibi</span>
        </div>

        <div class="gallery-item" onclick="openModal('img/galeri3.jpg')">
            <img src="img/galeri3.jpg">
            <span class="gallery-text">Akademi Mezuniyet Töreni</span>
        </div>

    </div>
</section>

<!-- MODAL -->
<div class="image-modal" id="imageModal">
    <span class="close-btn" onclick="closeModal()">✕</span>
    <img id="modalImg">
</div>

<script>
function openModal(src) {
    document.getElementById("imageModal").style.display = "flex";
    document.getElementById("modalImg").src = src;
}

function closeModal() {
    document.getElementById("imageModal").style.display = "none";
}
</script>

</body>
</html>
